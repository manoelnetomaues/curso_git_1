plugins { id 'com.android.application' }

android {
    namespace 'br.com.vivamulher.app'
    compileSdk 36

    defaultConfig {
        applicationId 'br.com.vivamulher.app'
        minSdk 33
        targetSdk 36
        versionCode 2
        versionName '2.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
