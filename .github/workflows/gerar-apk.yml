name: Gerar APK Viva Mulher

on:
  push:
    branches: [viva-mulher-build]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android 16
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar APK
        run: gradle --no-daemon assembleDebug

      - name: Renomear instalador
        run: cp app/build/outputs/apk/debug/app-debug.apk Viva-Mulher.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Viva-Mulher-Android
          path: Viva-Mulher.apk
          retention-days: 30
